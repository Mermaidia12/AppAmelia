<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AH/SD — Questionários</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1a2e;--accent:#5b5bd6;--green:#059669;--red:#dc2626;--gray:#6b7280;
  --surface:#fff;--surface2:#f7f7fb;--border:#e8e8f0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--surface2);color:var(--ink);min-height:100vh;padding:2rem 1rem;max-width:600px;margin:0 auto}
h1{font-size:1.5rem;font-weight:700;text-align:center;margin-bottom:1rem}
.form-group{margin-bottom:1.5rem}
.form-group label{display:block;font-weight:600;margin-bottom:.5rem}
.form-group input, .form-group select, .form-group textarea{border:1.5px solid var(--border);border-radius:8px;padding:.75rem;font-size:1rem;width:100%;background:#fff}
.form-group textarea{resize:vertical;min-height:100px}
.btn{display:block;width:100%;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:1rem;font-size:1.1rem;font-weight:600;cursor:pointer;margin-top:1rem}
.btn:hover{background:#4a4ac8}
.q-section{background:#fff;border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:1rem}
.q-section h3{font-size:1.1rem;font-weight:700;margin-bottom:.75rem}
.q-item{margin-bottom:1rem}
.q-item label{display:block;font-weight:500;margin-bottom:.25rem}
.q-item input[type="radio"], .q-item input[type="checkbox"]{margin-right:.5rem}
.toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:.75rem 1.5rem;border-radius:8px;font-weight:600;display:none}
</style>
</head>
<body>
<h1>🧠 Questionários AH/SD</h1>
<p style="text-align:center;color:var(--gray);margin-bottom:2rem">Preencha os dados abaixo e responda aos questionários selecionados.</p>

<form id="questionario-form">
  <div class="form-group">
    <label>Nome do Aluno *</label>
    <input type="text" id="aluno" required>
  </div>
  <div class="form-group">
    <label>Escola</label>
    <input type="text" id="escola">
  </div>
  <div class="form-group">
    <label>Série/Ano</label>
    <input type="text" id="serie">
  </div>

  <div id="questionarios"></div>

  <button type="submit" class="btn">📤 Enviar Respostas</button>
</form>

<div id="toast" class="toast">✅ Enviado com sucesso!</div>

<script>
// Configurações - ALTERE AQUI A URL DO SEU APPS SCRIPT
const SCRIPT_URL = 'https://script.google.com/macros/s/.../exec'; // Cole a URL do Apps Script aqui

// Questionários (exemplo simplificado - adicione perguntas reais conforme necessário)
const QUESTIONARIOS = {
  'a1': {
    titulo: 'Anexo 1 — Entrevista Pais',
    secoes: {
      'Informações Gerais': [
        {pergunta: 'Como o aluno se comporta em casa?', tipo: 'textarea'},
        {pergunta: 'Quais são os interesses do aluno?', tipo: 'textarea'}
      ]
    }
  },
  'a2': {
    titulo: 'Anexo 2 — Indicadores',
    secoes: {
      'Indicadores': [
        {pergunta: 'O aluno demonstra curiosidade?', tipo: 'radio', opcoes: ['Sempre', 'Às vezes', 'Nunca']},
        {pergunta: 'O aluno aprende rapidamente?', tipo: 'radio', opcoes: ['Sempre', 'Às vezes', 'Nunca']}
      ]
    }
  },
  // Adicione os outros questionários aqui...
  'a3': {titulo: 'Anexo 3 — Primeira Infância', secoes: {}},
  'd_ling': {titulo: 'Anexo 4 — Linguagem', secoes: {}},
  'd_mat': {titulo: 'Anexo 5 — Matemática', secoes: {}},
  'd_mus': {titulo: 'Anexo 6 — Musical', secoes: {}},
  'd_art': {titulo: 'Anexo 7 — Artes Visuais', secoes: {}},
  'd_cie': {titulo: 'Anexo 8 — Ciências', secoes: {}},
  'd_mov': {titulo: 'Anexo 9 — Movimento', secoes: {}},
  'd_esp': {titulo: 'Anexo 10 — Espacial', secoes: {}},
  'd_soc': {titulo: 'Anexo 11 — Social', secoes: {}},
  'a12': {titulo: 'Anexo 12 — Estilo de Trabalho', secoes: {}},
  'a13': {titulo: 'Anexo 13 — Criatividade', secoes: {}},
  'a16': {titulo: 'Anexo 16 — Pós-identificação', secoes: {}}
};

function getParams() {
  const params = new URLSearchParams(window.location.search);
  return {
    qs: params.get('qs') ? params.get('qs').split(',') : [],
    id: params.get('id') || ''
  };
}

function buildForm() {
  const { qs, id } = getParams();
  if (!id) {
    document.body.innerHTML = '<h1>❌ Link inválido</h1><p>Este link não é válido. Solicite um novo ao responsável.</p>';
    return;
  }

  const container = document.getElementById('questionarios');
  qs.forEach(qid => {
    const q = QUESTIONARIOS[qid];
    if (!q) return;

    const section = document.createElement('div');
    section.className = 'q-section';
    section.innerHTML = `<h3>${q.titulo}</h3>`;

    Object.keys(q.secoes).forEach(secao => {
      if (secao !== 'Geral') section.innerHTML += `<h4 style="font-size:1rem;color:var(--gray);margin:1rem 0 .5rem">${secao}</h4>`;
      q.secoes[secao].forEach(item => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'q-item';
        itemDiv.innerHTML = `<label>${item.pergunta}</label>`;

        if (item.tipo === 'textarea') {
          itemDiv.innerHTML += `<textarea name="${qid}_${secao}_${item.pergunta}" placeholder="Sua resposta..."></textarea>`;
        } else if (item.tipo === 'radio') {
          item.opcoes.forEach(op => {
            itemDiv.innerHTML += `<label><input type="radio" name="${qid}_${secao}_${item.pergunta}" value="${op}"> ${op}</label><br>`;
          });
        }
        section.appendChild(itemDiv);
      });
    });

    container.appendChild(section);
  });
}

document.getElementById('questionario-form').addEventListener('submit', function(e) {
  e.preventDefault();

  const { id } = getParams();
  const formData = new FormData(e.target);
  const aluno = document.getElementById('aluno').value.trim();
  const escola = document.getElementById('escola').value.trim();
  const serie = document.getElementById('serie').value.trim();

  if (!aluno) {
    alert('Por favor, preencha o nome do aluno.');
    return;
  }

  const respostas = [];
  formData.forEach((value, key) => {
    if (value.trim()) {
      const parts = key.split('_', 3);
      respostas.push({
        instrumento: QUESTIONARIOS[parts[0]].titulo,
        secao: parts[1],
        pergunta: parts[2],
        resposta: value
      });
    }
  });

  fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({
      tipo: 'resposta',
      linkId: id,
      aluno: aluno,
      escola: escola,
      serie: serie,
      respostas: respostas
    })
  })
  .then(response => response.json())
  .then(data => {
    if (data.ok) {
      document.getElementById('toast').style.display = 'block';
      setTimeout(() => {
        document.getElementById('toast').style.display = 'none';
        // Opcional: redirecionar ou limpar form
      }, 3000);
    } else {
      alert('Erro ao enviar: ' + (data.error || 'Desconhecido'));
    }
  })
  .catch(error => {
    alert('Erro de conexão. Tente novamente.');
    console.error(error);
  });
});

buildForm();
</script>
</body>
</html></content>
