<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questionário AH/SD</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#1a1a2e; --ink2:#2d2d44; --accent:#5b5bd6; --accent2:#7c3aed;
  --green:#059669; --amber:#d97706; --red:#dc2626; --gray:#6b7280;
  --surface:#fff; --surface2:#f7f7fb; --border:#e8e8f0;
  --header-h:56px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--surface2);color:var(--ink);min-height:100vh}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:200;height:var(--header-h);background:var(--ink);display:flex;align-items:center;gap:1rem;padding:0 1.25rem;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.topbar-logo{font-family:'DM Serif Display',serif;font-size:1.1rem;color:#fff;white-space:nowrap}
.topbar-logo span{color:#a5b4fc}
.topbar-aluno{margin-left:auto;background:rgba(255,255,255,.1);color:#e0e7ff;font-size:.75rem;font-weight:600;padding:.25rem .75rem;border-radius:999px;white-space:nowrap;overflow:hidden;max-width:200px;text-overflow:ellipsis}

/* PROGRESS BAR */
.progress-topbar{height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s ease;position:fixed;top:var(--header-h);left:0;z-index:199}

/* STEPPER */
.stepper{display:flex;align-items:center;gap:0;overflow-x:auto;padding:1rem 1.25rem .5rem;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.step{display:flex;flex-direction:column;align-items:center;gap:.25rem;min-width:70px;cursor:pointer;opacity:.45;transition:opacity .2s}
.step.active{opacity:1}
.step.done{opacity:.75}
.step-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:all .2s;flex-shrink:0}
.step.active .step-dot{border-color:var(--accent);background:#ede9fe;box-shadow:0 0 0 3px rgba(91,91,214,.2)}
.step.done .step-dot{background:var(--green);border-color:var(--green);color:#fff}
.step-line{width:24px;height:2px;background:var(--border);flex-shrink:0;align-self:flex-start;margin-top:13px}
.step-line.done{background:var(--green)}
.step-label{font-size:.6rem;font-weight:600;color:var(--gray);text-align:center;max-width:64px;line-height:1.3}
.step.active .step-label{color:var(--accent);font-weight:700}

/* MAIN */
.main{max-width:800px;margin:0 auto;padding:1.25rem 1.25rem 4rem}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.4rem;margin-bottom:1.25rem;box-shadow:var(--shadow);display:none}
.card.active{display:block}
.card-title{font-size:1rem;font-weight:700;color:var(--ink);padding-bottom:.75rem;margin-bottom:.75rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.5rem}
.page-tag{display:inline-flex;align-items:center;background:#ede9fe;color:var(--accent);font-size:.7rem;font-weight:700;padding:.2rem .6rem;border-radius:4px;margin-bottom:.5rem;letter-spacing:.04em;text-transform:uppercase}
.page-header{margin-bottom:1.25rem}
.page-header h2{font-size:1.3rem;font-weight:700}
.page-header p{color:var(--gray);font-size:.875rem;margin-top:.25rem}

/* FORM */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.75rem;margin-bottom:1rem}
.form-group{display:flex;flex-direction:column;gap:.3rem}
.form-group label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gray)}
.form-group input,.form-group select,.form-group textarea{border:1.5px solid var(--border);border-radius:8px;padding:.5rem .75rem;font-size:.875rem;font-family:inherit;background:var(--surface2);transition:border-color .15s;color:var(--ink)}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent);background:#fff}
.form-group textarea{resize:vertical;min-height:90px}
.form-group input[readonly]{background:#f3f4f6;color:var(--gray);cursor:default}

/* SECTION HEADER ROWS */
.sec-chip{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:.45rem .9rem;border-radius:6px;font-weight:700;font-size:.82rem;margin:1rem 0 .5rem;letter-spacing:.03em}
tr.sec-hdr td{background:linear-gradient(135deg,var(--accent),var(--accent2));padding:.45rem .6rem;border-bottom:none;font-weight:700;font-size:.78rem;letter-spacing:.03em;color:#fff}
tr.sec-hdr td:first-child{border-radius:6px 0 0 6px}
tr.sec-hdr td:last-child{border-radius:0 6px 6px 0}
.sec-hdr-label{font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;opacity:.92;text-align:center}
.sec-hdr-label.lbl-n{color:#fca5a5}.sec-hdr-label.lbl-av{color:#fcd34d}
.sec-hdr-label.lbl-s{color:#6ee7b7}.sec-hdr-label.lbl-no{color:#d1d5db}
.sec-hdr-label.lbl-sim{color:#6ee7b7}.sec-hdr-label.lbl-nao{color:#fca5a5}

/* TABLES */
.q-table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.q-table colgroup col:first-child{width:54%}
.q-table thead{display:none}
.q-table td{padding:.55rem .6rem;border-bottom:1px solid var(--border);font-size:.84rem;vertical-align:middle}
.q-table td:not(:first-child){text-align:center}
.q-table tr:last-child td{border-bottom:none}
.q-table tr:hover:not(.sec-hdr) td{background:#fafaff}
.q-num{color:var(--accent);font-weight:700;margin-right:.3rem}
.q-table input[type="radio"]{display:none}
.q-table label.rl{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:2px solid var(--border);border-radius:50%;cursor:pointer;transition:all .15s;font-size:.7rem}
.q-table input[type="radio"]:checked+label.rl{border-width:0;color:#fff}
.col-n input:checked+label.rl{background:var(--red)}
.col-av input:checked+label.rl{background:var(--amber)}
.col-s input:checked+label.rl{background:var(--green)}
.col-no input:checked+label.rl{background:var(--gray)}

.sn-table{width:100%;border-collapse:separate;border-spacing:0}
.sn-table thead{display:none}
.sn-table td{padding:.55rem .75rem;border-bottom:1px solid var(--border);font-size:.84rem;vertical-align:middle}
.sn-table td:not(:first-child){text-align:center}
.sn-table tr:last-child td{border-bottom:none}
.sn-table tr:hover:not(.sec-hdr) td{background:#fafaff}
.sn-table input[type="radio"]{display:none}
.sn-table label.sl{display:inline-flex;align-items:center;justify-content:center;width:30px;height:26px;border:2px solid var(--border);border-radius:6px;cursor:pointer;font-size:.72rem;font-weight:700;transition:all .15s;color:var(--gray)}
.sn-table .col-sim input:checked+label.sl{background:var(--green);border-color:var(--green);color:#fff}
.sn-table .col-nao input:checked+label.sl{background:var(--red);border-color:var(--red);color:#fff}

/* OPEN QUESTION */
.open-q{margin-bottom:1rem}
.open-q label{display:block;font-size:.8rem;font-weight:600;color:var(--ink2);margin-bottom:.35rem}
.open-q label .qn{color:var(--accent);font-weight:700;margin-right:.3rem}
.open-q textarea{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:.6rem .8rem;font-size:.84rem;font-family:inherit;background:var(--surface2);resize:vertical;min-height:80px;transition:border-color .15s}
.open-q textarea:focus{outline:none;border-color:var(--accent);background:#fff}

/* PROGRESS */
.progress-wrap{margin-bottom:1rem}
.progress-row{display:flex;justify-content:space-between;font-size:.78rem;margin-bottom:.3rem;color:var(--gray)}
.progress-row strong{color:var(--ink)}
.prog-bg{background:var(--surface2);border-radius:999px;height:8px;overflow:hidden;border:1px solid var(--border)}
.prog-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s ease}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:.45rem;padding:.6rem 1.25rem;border:none;border-radius:8px;font-family:inherit;font-size:.875rem;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-green{background:var(--green);color:#fff}
.btn-ghost{background:var(--surface2);color:var(--ink2);border:1.5px solid var(--border)}
.btn-ghost:hover{background:var(--border)}
.btn-bar{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--border)}

/* VALIDATION */
.val-panel{display:none;background:#fff5f5;border:1.5px solid #fca5a5;border-radius:10px;padding:1rem 1.1rem;margin-top:1rem;animation:shake .35s ease}
.val-panel.open{display:block}
.val-panel-title{font-size:.82rem;font-weight:700;color:#dc2626;display:flex;align-items:center;gap:.4rem;margin-bottom:.6rem}
.val-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.3rem}
.val-list li{display:flex;align-items:baseline;gap:.45rem;font-size:.8rem;color:#7f1d1d;background:#fee2e2;border-radius:6px;padding:.35rem .65rem}
.val-list li .val-num{font-weight:800;color:#dc2626;flex-shrink:0;font-size:.75rem;background:#fca5a5;border-radius:4px;padding:.05rem .35rem}
.val-list li .val-sec{font-size:.68rem;color:#991b1b;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-left:auto;flex-shrink:0}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* FIXED NAV */
.nav-fixed{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:.75rem 1.25rem;display:flex;justify-content:space-between;align-items:center;gap:.75rem;z-index:150;box-shadow:0 -4px 12px rgba(0,0,0,.08)}
.nav-step-info{font-size:.8rem;color:var(--gray);font-weight:600}
.nav-step-info strong{color:var(--ink)}

/* SUCCESS */
.success-screen{text-align:center;padding:3rem 1.5rem}
.success-screen .icon{font-size:4rem;margin-bottom:1rem}
.success-screen h2{font-size:1.5rem;font-weight:700;color:var(--green);margin-bottom:.75rem}
.success-screen p{color:var(--gray);font-size:.95rem;line-height:1.6}

/* NO LINK */
.no-link{text-align:center;padding:4rem 2rem}
.no-link .icon{font-size:3rem;margin-bottom:1rem}
.no-link h2{font-size:1.3rem;font-weight:700;margin-bottom:.5rem}
.no-link p{color:var(--gray);font-size:.9rem}

/* TOAST */
#toast{position:fixed;bottom:5rem;right:1.5rem;background:var(--ink);color:#fff;padding:.8rem 1.25rem;border-radius:10px;font-weight:600;font-size:.875rem;box-shadow:0 8px 32px rgba(0,0,0,.2);transform:translateY(80px);opacity:0;transition:all .3s;z-index:999}
#toast.show{transform:translateY(0);opacity:1}

/* A12 PAIRS */
.a12-pair-row{display:flex;align-items:flex-start;gap:.75rem;padding:.6rem 0;border-bottom:1px solid var(--border)}
.a12-pair-row:last-child{border-bottom:none}
.a12-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.55rem;transition:all .15s;cursor:pointer}

@media(max-width:600px){
  .main{padding:1rem 1rem 5rem}
  .q-table{font-size:.78rem}
  .q-table th,.q-table td{padding:.4rem .3rem}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-logo">🧠 AH/<span>SD</span></div>
  <div class="topbar-aluno" id="topbar-aluno">Carregando...</div>
</header>
<div class="progress-topbar" id="progress-topbar" style="width:0%"></div>

<div style="overflow-x:auto">
  <div class="stepper" id="stepper"></div>
</div>

<main class="main" id="main-content"></main>

<div class="nav-fixed" id="nav-fixed" style="display:none">
  <div class="nav-step-info">Passo <strong id="nav-current">1</strong> de <strong id="nav-total">1</strong></div>
  <div style="display:flex;gap:.6rem">
    <button class="btn btn-ghost" id="btn-prev" onclick="irPara(-1)" style="display:none">← Anterior</button>
    <button class="btn btn-primary" id="btn-next" onclick="irPara(1)">Próximo →</button>
    <button class="btn btn-green" id="btn-submit" onclick="enviarTudo()" style="display:none">✅ Enviar Respostas</button>
  </div>
</div>

<div id="toast"></div>

<script>

  'Quais as facilidades e dificuldades de se ter um filho com AH/SD?',
  'O que você acredita ser necessário para melhorar o reconhecimento e atendimento da criança com AH/SD nas escolas do município?',
];
const A2_SECTIONS=[{title:'ESTILO DE TRABALHO',qs:['As pessoas dizem que ele(a) faz coisas antes do esperado para sua faixa etária?','Acrescenta qualidades únicas a uma tarefa?','Gosta de juntar "coisas" para fazer experimentos, com interesse em descobrir o que acontece?','Destaca-se do grupo porque trabalha sozinho(a), não necessitando de ajuda?','Apresenta comportamentos iguais aos das outras crianças da mesma idade?','Observa atentamente e retém informações a respeito das coisas que observa?','Expressa ideias com facilidade através de desenhos?']},{title:'ÁREA LINGUÍSTICA',qs:['Inicia conversas espontaneamente, trazendo assuntos diferenciados para sua idade?','Expressa ideias com facilidade oralmente ou por escrito?','Usa vocabulário avançado para sua idade?','Descreve um objeto de várias maneiras?','Tem facilidade para representar um objeto ou ideia de várias maneiras?']},{title:'ÁREA LÓGICO-MATEMÁTICA',qs:['Compreende conceitos numéricos para além dos números de 1 a 10?','Constrói uma estratégia para resolver um problema?','Faz perguntas para entender como as coisas funcionam?','Tem facilidade com quebra-cabeças utilizados por crianças maiores?','Demonstra habilidade ao usar o computador?']},{title:'ÁREA INTRAPESSOAL',qs:['Concentra-se em tópicos ou tarefas de seu interesse?','É persistente nas atividades que ele mesmo escolhe para fazer?','Manifesta senso de humor diferenciado para sua idade?','Costuma criar conflitos com os(as) amigos(as) porque suas ideias são diferentes?','Consegue rir das coisas engraçadas ou erradas que faz?']},{title:'ÁREA INTERPESSOAL',qs:['Prefere participar em atividades grupais?','Gosta de ensinar o que sabe para as demais crianças?','As outras crianças buscam a sua companhia para diferentes atividades?','Ajuda a resolver conflitos entre amigos(as)?']},{title:'ÁREA CORPORAL-CINESTÉSICA',qs:['Expressa ideias com facilidade através da dramatização?','Gosta de montar e desmontar objetos para ver como funcionam?','Prefere atividades que incluam o movimento, destacando-se pela harmonia?','Gosta de interpretar histórias, poemas e canções?']},{title:'ÁREA ESPACIAL',qs:['Junta objetos imaginativamente para construir algo?','Gosta de organizar e agrupar objetos?','Planeja cuidadosamente o uso do espaço?']},{title:'ÁREA MUSICAL',qs:['Reproduz com facilidade melodias e músicas que acabou de ouvir?','Canta ou cantarola, com ritmo e melodia, durante outras atividades?','Experimenta os objetos para criar sons diferentes?','Tem facilidade em aprender através da música?']},{title:'ÁREA NATURALÍSTICA',qs:['Fala muito sobre seus bichinhos de estimação ou sobre lugares preferidos na natureza?','Está preocupado(a) e defende os direitos dos animais e da natureza?','Gosta de fazer projetos que envolva a observação da natureza?']}];

function confirmarIdentificacao() {
  const nome  = document.getElementById('ident-nome').value.trim();
  const escola= document.getElementById('ident-escola').value.trim();
  if (!nome) {
    mostrarErros('val-ident', [{num:'—', text:'Nome da criança é obrigatório', sec:''}]);
    return;
  }
  if (!escola) {
    mostrarErros('val-ident', [{num:'—', text:'Nome da escola é obrigatório', sec:''}]);
    return;
  }

  // Salva dados no objeto params para uso posterior
  dadosIdentificacao = {
    aluno:       nome,
    escola:      escola,
    serie:       document.getElementById('ident-serie').value.trim(),
    responsavel: document.getElementById('ident-responsavel').value.trim(),
  };

  document.getElementById('topbar-aluno').textContent = `👤 ${nome}`;
  document.title = `Questionário AH/SD — ${nome}`;

  document.getElementById('stepper').style.display = '';
  document.getElementById('nav-fixed').style.display = 'flex';
  buildStepper();
  renderStep(0);
  atualizarNav();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ════════════════════════════════════════
// STEPPER
// ════════════════════════════════════════
function buildStepper() {
  const s = document.getElementById('stepper');
  s.innerHTML = '';
  questionarioIds.forEach((id, i) => {
    const info = LABELS[id] || {};
    if (i > 0) {
      const line = document.createElement('div');
      line.className = 'step-line'; line.id = `line-${i}`;
      s.appendChild(line);
    }
    const step = document.createElement('div');
    step.className = 'step' + (i===0?' active':'');
    step.id = `step-${i}`;
    step.innerHTML = `<div class="step-dot">${info.icon||'📄'}</div><div class="step-label">${info.tag||id}</div>`;
    step.onclick = () => { if (i <= stepAtual) irParaStep(i); };
    s.appendChild(step);
  });
}

function atualizarStepper() {
  questionarioIds.forEach((id, i) => {
    const s = document.getElementById(`step-${i}`);
    const l = document.getElementById(`line-${i}`);
    if (!s) return;
    s.className = 'step' + (i===stepAtual?' active':'') + (i<stepAtual?' done':'');
    if (i<stepAtual) s.querySelector('.step-dot').textContent = '✓';
    else s.querySelector('.step-dot').textContent = LABELS[id]?.icon||'📄';
    if (l) l.className = 'step-line' + (i<=stepAtual?' done':'');
  });
}

// ════════════════════════════════════════
// NAVEGAÇÃO
// ════════════════════════════════════════
function atualizarNav() {
  document.getElementById('nav-current').textContent = stepAtual+1;
  document.getElementById('nav-total').textContent   = questionarioIds.length;
  document.getElementById('btn-prev').style.display  = stepAtual>0?'':'none';
  const isLast = stepAtual === questionarioIds.length-1;
  document.getElementById('btn-next').style.display   = isLast?'none':'';
  document.getElementById('btn-submit').style.display = isLast?'':'none';
  document.getElementById('progress-topbar').style.width = ((stepAtual+1)/questionarioIds.length*100)+'%';
}

function irPara(delta) {
  const id = questionarioIds[stepAtual];
  if (delta > 0) {
    const erros = validar(id);
    if (erros.length) {
      mostrarErros(`val-${id}`, erros); return;
    }
    coletarRespostas(id);
    limparErros(`val-${id}`);
  }
  irParaStep(stepAtual + delta);
}

function irParaStep(idx) {
  stepAtual = Math.max(0, Math.min(idx, questionarioIds.length-1));
  renderStep(stepAtual);
  atualizarNav();
  atualizarStepper();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

  } else if (id === 'a16') {
    html += buildOpenForm('a16', A16_QUESTIONS);
  } else if (DOMAINS[id]) {
    html += buildDomainForm(id);
  }

  html += `<div class="val-panel" id="val-${id}"></div></div>`;
  main.innerHTML = html;
}

// ════════════════════════════════════════
// FORM BUILDERS
// ════════════════════════════════════════
function buildOpenForm(prefix, questions) {
  return questions.map((q,i)=>
    `<div class="open-q"><label><span class="qn">${i+1}.</span>${q}</label>
     <textarea id="${prefix}_q${i}" placeholder="Sua resposta..."></textarea></div>`
  ).join('');
}

function buildTableForm(prefix, sections, colClasses, vals, colLabels, lblClasses) {
  let qn=0, html=`<table class="q-table"><colgroup><col>${colClasses.map(()=>`<col style="width:12%">`).join('')}</colgroup><thead><tr><th></th>${colLabels.map(l=>`<th>${l}</th>`).join('')}</tr></thead><tbody>`;
  sections.forEach(sec=>{
    html+=`<tr class="sec-hdr"><td>${sec.title}</td>${lblClasses.map((c,i)=>`<td><span class="sec-hdr-label ${c}">${colLabels[i]}</span></td>`).join('')}</tr>`;
    sec.qs.forEach(q=>{
      qn++;
      html+=`<tr><td><span class="q-num">${qn}.</span>${q}</td>`;
      colClasses.forEach((cls,ci)=>{
        html+=`<td class="${cls}"><input type="radio" name="${prefix}q${qn}" id="${prefix}q${qn}_${ci}" value="${vals[ci]}"><label class="rl" for="${prefix}q${qn}_${ci}">✓</label></td>`;
      });
      html+='</tr>';
    });
  });
  html+='</tbody></table>';
  const total=qn;
  return `<div class="progress-wrap"><div class="progress-row"><strong>Progresso</strong><span id="${prefix}-txt">0 / ${total} respondidas</span></div><div class="prog-bg"><div class="prog-fill" id="${prefix}-bar" style="width:0%"></div></div></div>`
    + html.replace(/<input type="radio"/g, `<input type="radio" onchange="updateProg('${prefix}',${total})"`);
}

function buildSNForm() {
  let qn=0, html='', total=A3_SECTIONS.reduce((s,sec)=>s+sec.qs.length,0);
  A3_SECTIONS.forEach(sec=>{
    html+=`<table class="sn-table"><tbody><tr class="sec-hdr"><td>${sec.title}</td><td><span class="sec-hdr-label lbl-sim">SIM</span></td><td><span class="sec-hdr-label lbl-nao">NÃO</span></td></tr>`;
    sec.qs.forEach(q=>{
      qn++;
      html+=`<tr><td><span class="q-num">${qn}.</span>${q}</td>
        <td class="col-sim"><input type="radio" name="a3q${qn}" id="a3q${qn}_s" value="sim" onchange="updateProg('a3',${total})"><label class="sl" for="a3q${qn}_s">S</label></td>
        <td class="col-nao"><input type="radio" name="a3q${qn}" id="a3q${qn}_n" value="nao" onchange="updateProg('a3',${total})"><label class="sl" for="a3q${qn}_n">N</label></td></tr>`;
    });
    html+='</tbody></table>';
  });
  return `<div class="progress-wrap"><div class="progress-row"><strong>Progresso</strong><span id="a3-txt">0 / ${total} respondidas</span></div><div class="prog-bg"><div class="prog-fill" id="a3-bar" style="width:0%"></div></div></div>`+html;
}

function buildDomainForm(id) {
  const dom=DOMAINS[id]; let qn=0;
  const total=dom.sections.reduce((s,sec)=>s+sec.qs.length,0);
  const colLblClasses=['lbl-n','lbl-av','lbl-s','lbl-no'];
  let html=`<table class="q-table"><colgroup><col>${dom.colClasses.map(()=>`<col style="width:12%">`).join('')}</colgroup><tbody>`;
  dom.sections.forEach(sec=>{
    html+=`<tr class="sec-hdr"><td>${sec.title}</td>${dom.cols.map((c,ci)=>`<td><span class="sec-hdr-label ${colLblClasses[ci]||''}">${c}</span></td>`).join('')}</tr>`;
    sec.qs.forEach(q=>{
      qn++;
      html+=`<tr><td><span class="q-num">${qn}.</span>${q}</td>`;
      dom.colClasses.forEach((cls,ci)=>{
        html+=`<td class="${cls}"><input type="radio" name="${id}q${qn}" id="${id}q${qn}_${ci}" value="${ci}" onchange="updateProg('${id}',${total})"><label class="rl" for="${id}q${qn}_${ci}">✓</label></td>`;
      });
      html+='</tr>';
    });
  });
  html+='</tbody></table>';
  return `<div class="progress-wrap"><div class="progress-row"><strong>Progresso</strong><span id="${id}-txt">0 / ${total} respondidas</span></div><div class="prog-bg"><div class="prog-fill" id="${id}-bar" style="width:0%"></div></div></div>`+html;
}

function buildA12Form() {
  const total=A12_PAIRS.length*2;
  let qn=0, html=`<div style="background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:6px;padding:.45rem .9rem;margin-bottom:.5rem;display:flex;align-items:center"><span style="flex:1;font-size:.78rem;font-weight:700;color:#fff">ESTILO DE TRABALHO</span><div style="display:flex;gap:1rem;flex-shrink:0"><span style="font-size:.65rem;font-weight:800;color:#fca5a5;text-transform:uppercase">Não</span><span style="font-size:.65rem;font-weight:800;color:#fcd34d;text-transform:uppercase">Às Vezes</span><span style="font-size:.65rem;font-weight:800;color:#6ee7b7;text-transform:uppercase">Sempre</span><span style="font-size:.65rem;font-weight:800;color:#d1d5db;text-transform:uppercase">Não Obs.</span></div></div>`;
  A12_PAIRS.forEach((pair,i)=>{
    pair.forEach((char,side)=>{
      qn++;
      const colors=['var(--red)','var(--amber)','var(--green)','var(--gray)'];
      html+=`<div class="a12-pair-row"><span style="color:var(--accent);font-weight:700;font-size:.8rem;width:24px;flex-shrink:0;padding-top:.1rem">${qn}.</span><span style="flex:1;font-size:.84rem">${char}</span><div style="display:flex;gap:.5rem;flex-shrink:0">${['Não','Às Vezes','Sempre','Não Obs.'].map((lbl,vi)=>`<label style="display:flex;flex-direction:column;align-items:center;gap:.2rem;cursor:pointer;font-size:.65rem;color:var(--gray)"><input type="radio" name="a12q${qn}" value="${vi}" onchange="updateProg('a12',${total})" style="display:none"><span class="a12-dot" data-name="a12q${qn}" data-val="${vi}" onclick="pickA12(this,'${colors[vi]}')" style="width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.55rem;transition:all .15s">✓</span>${lbl}</label>`).join('')}</div></div>`;
    });
  });
  return `<div class="progress-wrap"><div class="progress-row"><strong>Progresso</strong><span id="a12-txt">0 / ${total} respondidas</span></div><div class="prog-bg"><div class="prog-fill" id="a12-bar" style="width:0%"></div></div></div>`+html;
}

// ════════════════════════════════════════
// A12 DOT PICKER
// ════════════════════════════════════════
function pickA12(el, color) {
  const name=el.dataset.name;
  document.querySelectorAll(`[data-name="${name}"]`).forEach(d=>{
    d.style.background='';d.style.borderColor='var(--border)';d.style.color='var(--gray)';
    d.previousElementSibling.checked=false;
  });
  el.style.background=color;el.style.borderColor=color;el.style.color='#fff';
  el.previousElementSibling.checked=true;
  const total=A12_PAIRS.length*2;
  let ans=0;
  for(let i=1;i<=total;i++){if(document.querySelector(`input[name="a12q${i}"]:checked`))ans++;}
  const bar=document.getElementById('a12-bar');const txt=document.getElementById('a12-txt');
  if(bar)bar.style.width=(ans/total*100)+'%';
  if(txt)txt.textContent=`${ans} / ${total} avaliadas`;
}

// ════════════════════════════════════════
// PROGRESS
// ════════════════════════════════════════
function updateProg(prefix, total) {
  let ans=0;
  for(let i=1;i<=total;i++){if(document.querySelector(`input[name="${prefix}q${i}"]:checked`))ans++;}
  const bar=document.getElementById(`${prefix}-bar`);
  const txt=document.getElementById(`${prefix}-txt`);
  if(bar)bar.style.width=(ans/total*100)+'%';
  if(txt)txt.textContent=`${ans} / ${total} respondidas`;
}

// ════════════════════════════════════════
// COLETAR RESPOSTAS
// ════════════════════════════════════════
function coletarRespostas(id) {
  const res = {};
  if (id === 'a1') {
    const secao = {};
    A1_QUESTIONS.forEach((q,i)=>{ secao[q]=(document.getElementById(`a1_q${i}`)?.value||''); });
    res['Questões']=secao;
  } else if (id === 'a16') {
    const secao={};
    A16_QUESTIONS.forEach((q,i)=>{ secao[q]=(document.getElementById(`a16_q${i}`)?.value||''); });
    res['Questões']=secao;
  } else if (id === 'a2') {
    let qn=0;
    A2_SECTIONS.forEach(sec=>{ const s={}; sec.qs.forEach(q=>{ qn++; const c=document.querySelector(`input[name="a2q${qn}"]:checked`); s[q]=c?c.value:''; }); res[sec.title]=s; });
  } else if (id === 'a3') {
    let qn=0;
    A3_SECTIONS.forEach(sec=>{ const s={}; sec.qs.forEach(q=>{ qn++; const c=document.querySelector(`input[name="a3q${qn}"]:checked`); s[q]=c?c.value:''; }); res[sec.title]=s; });
  } else if (id === 'a12') {
    const total=A12_PAIRS.length*2; const valMap=['Não','Às Vezes','Sempre','Não Observado']; const s={};
    A12_PAIRS.forEach((pair,i)=>{ pair.forEach((char,side)=>{ const qn=i*2+side+1; const c=document.querySelector(`input[name="a12q${qn}"]:checked`); s[char]=c?valMap[parseInt(c.value)]:''; }); });
    res['ESTILO DE TRABALHO']=s;
  } else if (id === 'a13') {
    let qn=0;
    A13_SECTIONS.forEach(sec=>{ const s={}; sec.qs.forEach(q=>{ qn++; const c=document.querySelector(`input[name="a13q${qn}"]:checked`); s[q]=c?c.value:''; }); res[sec.title]=s; });
  } else if (DOMAINS[id]) {
    const dom=DOMAINS[id]; let qn=0;
    dom.sections.forEach(sec=>{ const s={}; sec.qs.forEach(q=>{ qn++; const c=document.querySelector(`input[name="${id}q${qn}"]:checked`); s[q]=c?(dom.cols[parseInt(c.value)]||c.value):''; }); res[sec.title]=s; });
  }
  respostasColetadas[id] = res;
}

// ════════════════════════════════════════
// VALIDAÇÃO
// ════════════════════════════════════════
function validar(id) {
  const erros = [];
  if (id === 'a1') {
    A1_QUESTIONS.forEach((q,i)=>{ if(!(document.getElementById(`a1_q${i}`)?.value||'').trim()) erros.push({num:i+1,text:q.substring(0,80),sec:''}); });
  } else if (id === 'a16') {
    A16_QUESTIONS.forEach((q,i)=>{ if(!(document.getElementById(`a16_q${i}`)?.value||'').trim()) erros.push({num:i+1,text:q.substring(0,80),sec:''}); });
  } else if (id === 'a2') {
    let qn=0; A2_SECTIONS.forEach(sec=>{ sec.qs.forEach(q=>{ qn++; if(!document.querySelector(`input[name="a2q${qn}"]:checked`)) erros.push({num:qn,text:q.substring(0,80),sec:sec.title}); }); });
  } else if (id === 'a3') {
    let qn=0; A3_SECTIONS.forEach(sec=>{ sec.qs.forEach(q=>{ qn++; if(!document.querySelector(`input[name="a3q${qn}"]:checked`)) erros.push({num:qn,text:q.substring(0,80),sec:sec.title}); }); });
  } else if (id === 'a12') {
    const total=A12_PAIRS.length*2; A12_PAIRS.forEach((pair,i)=>{ pair.forEach((char,side)=>{ const qn=i*2+side+1; if(!document.querySelector(`input[name="a12q${qn}"]:checked`)) erros.push({num:qn,text:char,sec:''}); }); });
  } else if (id === 'a13') {
    let qn=0; A13_SECTIONS.forEach(sec=>{ sec.qs.forEach(q=>{ qn++; if(!document.querySelector(`input[name="a13q${qn}"]:checked`)) erros.push({num:qn,text:q.substring(0,80),sec:sec.title}); }); });
  } else if (DOMAINS[id]) {
    const dom=DOMAINS[id]; let qn=0; dom.sections.forEach(sec=>{ sec.qs.forEach(q=>{ qn++; if(!document.querySelector(`input[name="${id}q${qn}"]:checked`)) erros.push({num:qn,text:q.substring(0,80),sec:sec.title}); }); });
  }
  return erros;
}

function mostrarErros(panelId, erros) {
  const p=document.getElementById(panelId); if(!p) return;
  const items=erros.map(e=>`<li><span class="val-num">${e.num}</span><span>${e.text}${e.text.length>=80?'…':''}</span>${e.sec?`<span class="val-sec">${e.sec}</span>`:''}</li>`).join('');
  p.innerHTML=`<div class="val-panel-title">⚠️ ${erros.length} pergunta${erros.length>1?'s':''} sem resposta — preencha antes de continuar</div><ul class="val-list">${items}</ul>`;
  p.classList.add('open');
  p.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function limparErros(panelId) {
  const p=document.getElementById(panelId); if(p){p.classList.remove('open');p.innerHTML='';}
}

// ════════════════════════════════════════
// ENVIAR TUDO
// ════════════════════════════════════════
async function enviarTudo() {
  const id = questionarioIds[stepAtual];
  const erros = validar(id);
  if (erros.length) { mostrarErros(`val-${id}`, erros); return; }
  coletarRespostas(id);

  const aluno  = dadosIdentificacao.aluno       || '';
  const escola = dadosIdentificacao.escola      || '';
  const serie  = dadosIdentificacao.serie       || '';
  const resp   = dadosIdentificacao.responsavel || '';
  const linkId = params.get('id') || '';

  // Enviar uma requisição por questionário
  const promises = questionarioIds.map(qid => {
    const payload = {
      tipo: 'resposta', aluno, escola, serie, responsavel: resp, linkId,
      instrumento: LABELS[qid]?.label || qid,
      respostas: respostasColetadas[qid] || {}
    };
    if (!APPS_SCRIPT_URL) return Promise.resolve();
    return fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    }).catch(()=>{});
  });

  document.getElementById('btn-submit').disabled = true;
  document.getElementById('btn-submit').textContent = '⏳ Enviando...';

  await Promise.allSettled(promises);

  // Tela de sucesso
  document.getElementById('nav-fixed').style.display = 'none';
  document.getElementById('stepper').style.display   = 'none';
  document.getElementById('progress-topbar').style.width = '100%';
  document.getElementById('main-content').innerHTML  = `
    <div class="card active">
      <div class="success-screen">
        <div class="icon">✅</div>
        <h2>Respostas enviadas!</h2>
        <p>Obrigado por responder os questionários de <strong>${aluno}</strong>.<br>
        O avaliador receberá suas respostas automaticamente.<br><br>
        Você já pode fechar esta página.</p>
      </div>
    </div>`;
}

// ════════════════════════════════════════
// TOAST
// ════════════════════════════════════════
function toast(msg, color='#5b5bd6') {
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.background=color;
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);
}
